name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.out

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Build CLI binaries for all platforms
      - name: Build CLI Linux AMD64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/undependent_linux_amd64 ./cmd/cli
      - name: Build CLI Linux ARM64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/undependent_linux_arm64 ./cmd/cli
      - name: Build CLI macOS AMD64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/undependent_darwin_amd64 ./cmd/cli
      - name: Build CLI macOS ARM64
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/undependent_darwin_arm64 ./cmd/cli
      - name: Build CLI Windows AMD64
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/undependent_windows_amd64.exe ./cmd/cli

      # Build server binary
      - name: Build Server
        run: CGO_ENABLED=0 go build -trimpath -o dist/undependent-server ./cmd/server

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: undependent-cli
          path: |
            dist/undependent_linux_amd64
            dist/undependent_linux_arm64
            dist/undependent_darwin_amd64
            dist/undependent_darwin_arm64
            dist/undependent_windows_amd64.exe
      - name: Upload Server artifact
        uses: actions/upload-artifact@v4
        with:
          name: undependent-server
          path: dist/undependent-server