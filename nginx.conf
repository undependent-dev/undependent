events {
    worker_connections 1024;
}

http {
    upstream backend {
        server app:8080;
    }

    # HTTP → redirect to HTTPS
    server {
        listen 80;
        server_name undependent.dev;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name undependent.dev;

        ssl_certificate     /etc/ssl/certs/undependent.dev.crt;
        ssl_certificate_key /etc/ssl/private/undependent.dev.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Static marketing site
        root /usr/share/nginx/html;
        index index.html;

        # API routes → Go backend
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # Stripe webhook — must not be proxied through rate limits
        location /api/webhook/stripe {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # Health check
        location /health {
            proxy_pass http://backend/api/health;
        }

        # Everything else → static files (SPA fallback)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Gzip
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        gzip_min_length 1000;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}